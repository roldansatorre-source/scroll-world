<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profundidad</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="_base.css">
<style>
body{background:radial-gradient(90% 70% at 50% 35%,#FBF7EF 0%,#F1EADC 55%,#E6DDCB 100%)}
.nav img{filter:none}.nav a.p{background:var(--green);color:var(--cream)}
.big{position:fixed;left:0;right:0;top:15vh;text-align:center;z-index:1;font-family:Lora,serif;font-weight:600;color:var(--green);
 font-size:min(23vw,34vh);line-height:.9;letter-spacing:-.03em;white-space:nowrap;opacity:0;animation:b 1.4s cubic-bezier(.2,.8,.2,1) .1s forwards;transform:translate(var(--mx,0),var(--my,0))}
@keyframes b{from{opacity:0;letter-spacing:.08em}to{opacity:1;letter-spacing:-.03em}}
.sofa{position:fixed;left:50%;bottom:17vh;z-index:3;width:min(86vw,118vh);transform:translate(calc(-50% + var(--sx,0px)),var(--sy,0));opacity:0;animation:s 1.4s cubic-bezier(.2,.8,.2,1) .5s forwards}
@keyframes s{from{opacity:0;margin-bottom:-60px}to{opacity:1;margin-bottom:0}}
.sofa img{width:100%;display:block;filter:drop-shadow(0 40px 40px rgba(47,74,60,.28))}
.floor{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:2;background:linear-gradient(transparent,rgba(47,74,60,.06))}
.under{position:fixed;left:0;right:0;bottom:5vh;z-index:4;text-align:center;opacity:0;animation:f 1s ease 1.2s forwards}
.under h2{font-family:Lora,serif;font-style:italic;font-weight:500;font-size:clamp(1.5rem,3vw,2.4rem);margin:0 0 16px}
.under a{display:inline-block;background:var(--green);color:var(--cream);padding:15px 26px;border-radius:999px;font-weight:600;text-decoration:none;margin:0 5px}
.under a.g{background:transparent;color:var(--green);border:1.5px solid rgba(47,74,60,.3)}
.hi{position:fixed;left:0;right:0;top:11vh;text-align:center;z-index:4;font-family:Lora,serif;font-style:italic;font-size:1.25rem;color:#56645B;opacity:0;animation:f 1s ease .2s forwards}
@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></head><body>
<nav class="nav"><img src="../assets/marca/logo-verde.png" alt="Tapicerías a Punto"><a class="p" href="#">Mándame una foto</a></nav>
<p class="hi">Hola, soy Dani<span class="d">.</span></p>
<div class="big" id="big">TU SOFÁ</div>
<div class="sofa" id="sofa"><img src="sofa.webp" alt="Sofá beige limpio con cojines verde salvia"></div>
<div class="floor"></div>
<div class="under"><h2>como el primer día<span class="d">.</span></h2><a href="#">Mándame una foto</a><a class="g" href="#">WhatsApp</a></div>
<script>
addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
 document.getElementById('big').style.setProperty('--mx',(-x*30)+'px');document.getElementById('big').style.setProperty('--my',(-y*14)+'px');
 const s=document.getElementById('sofa');s.style.setProperty('--sx',(x*24)+'px');s.style.setProperty('--sy',(y*10)+'px');});
</script></body></html>
